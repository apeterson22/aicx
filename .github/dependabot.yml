version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: monthly
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

