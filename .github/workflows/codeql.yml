name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: aegis-local
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: rust
      - uses: github/codeql-action/autobuild@v4.37.3
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:rust"

  analyze-python:
    name: Analyze Python
    runs-on: aegis-local
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:python"
