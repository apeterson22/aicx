[workspace]
members = [
    "crates/aicx-core",
    "crates/aicx-cli",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Aaron Peterson"]
repository = "https://github.com/apeterson22/aicx"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
lz4_flex = "0.13"
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
walkdir = "2.5"
xz2 = "0.1"
zstd = "0.13"
tempfile = "3.12"

